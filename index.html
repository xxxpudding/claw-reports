红利\n4. **港股科技** — 估值优势+AI催化\n\n### 风险提示\n- 美股芯片回调尚未结束，可能压制半导体情绪\n- 天量成交后若缩量，可能出现短期调整\n- 银行保险回调深度需观察，如果持续可能拖累大盘\n\n---\n\n> ⚠️ **免责声明：** 本报告基于公开数据整理，仅供学习参考，不构成投资建议。投资有风险，入市需谨慎。\n\n---\n\n*小爪 · 每日市场分析*\n"},{"date":"2026-05-12","md":"# 📊 盘前风向标 — 2026-05-12 (周二)\n\n---\n\n## 🌏 一、隔夜外围速览\n\n| 市场 | 状态 | 涨跌幅 | 关键点 |\n|------|------|--------|--------|\n| 美股道指 | ⬆️ | +0.19% | — |\n| **标普500** | 🚀 **续创新高** | +0.19% | 首破7400点 |\n| **纳斯达克** | 🚀 **续创新高** | +0.10% | — |\n| 英伟达 | — | — | 市值5.33万亿美元 |\n| 白银 | 🚀 独立走强 | +6% | 站上85美元关口，为3月13日以来首次 |\n\n**关键信号：**\n- 🚀 **标普500、纳指双双续创新高** — 全球风险偏好持续升温，科技外溢效应利好A股AI/半导体\n- 🇺🇸 **美联储人事变局** — 鲍威尔5月15日卸任主席后留任理事（75年来首次），沃什将任新主席；古尔斯比警示通胀仍为首要风险，降息预期降温，成长股短期承压\n- 🥈 **白银大涨6%** — 中信期货指出白银资金面显著改善，ETF连续第三日净流入，白银从被动跟涨转向主动计价\n\n---\n\n## 📌 二、今晨核心要闻（截止09:00）\n\n### 🔥 1. 特朗普访华进入倒计时（5月13-15日）\n外交部发言人郭嘉昆进一步介绍具体安排，称这是**美国总统时隔9年再次访华**，也是两国元首继去年10月釜山后再次面对面会晤。习近平主席将同特朗普总统就中美关系以及世界和平与发展的重大问题深入交换意见。\n- **最新进展**：何立峰副总理今日（5月12日）率团赴韩国与美方举行**经贸磋商**（先遣谈判为元首会晤铺垫）\n- **影响**：经贸关系缓和预期继续发酵，利好外贸出口、航空、科技板块\n\n### 🏦 2. 央行发布Q1货币政策执行报告 — 继续适度宽松\n央行明确：继续实施好适度宽松的货币政策，增强政策前瞻性灵活性针对性，保持流动性充裕和社会融资条件相对宽松。加强货币财政政策协同配合。\n- **表态基调**：不转向，流动性不紧\n- **影响**：对市场整体偏正面，支撑估值\n\n### ⚡ 3. 四部门印发AI与能源双向赋能方案 — 算电协同再出政策\n国家能源局会同发改委、工信部、国家数据局印发《关于促进人工智能与能源双向赋能的行动方案》。方案指出：\n- 将绿电使用占比作为算力设施布局的重要参考指标\n- 探索百万千瓦级AI算力设施与配套能源系统协同建设\n- 选择具备条件的地区开展试点\n- **核心影响**：算电协同方向再获国家级政策背书，润建股份、科华数据、中恒电气等持续受益\n\n### 🚗 4. 4月新能源乘联会数据：渗透率历史首破60%！\n乘联分会公布：4月全国新能源乘用车零售84.9万辆（同比-6.8%），渗透率**61.4%**，历史首次突破60%！\n- 同期燃油车零售仅53万辆，**同比暴跌37%**\n- 1-4月新能源累计零售275.8万辆（同比-17.2%）\n- **影响**：渗透率突破60%是里程碑事件，但销量同比下滑说明行业进入存量博弈期，新能源汽车板块分化加剧\n\n### 💰 5. A股成交额连续4日站上3万亿！融资客狂加2200亿\n- 截至5月11日收盘，A股成交额已连续4个交易日稳定在3万亿上方，较4月初低点接近翻倍\n- 4月以来融资客累计增持**2194亿元**\n- 融资余额攀升至**2.78万亿元**，持续刷新历史纪录\n- 资金高度集中在TMT赛道：电子板块净买额~879亿，通信224亿，TMT四大板块合计1222亿\n- **信号**：增量资金持续进场，但方向过于集中，拥挤度极高\n\n### 🛠️ 6. 中芯国际重组获上交所通过\n上交所5月11日公告，中芯国际（688981）发行股份购买资产获重组委会议通过。拟以**406.01亿元**收购中芯北方49%股权。\n- 大基金、北京集成电路装备中心等参与认购\n- 对中芯国际利好，巩固其晶圆代工龙头地位\n\n### 🏥 7. 百济神州Q1扭亏为盈\n百济神州：2026年Q1营收105.44亿元（同比+31.0%），归母净利润**16.08亿元**，上年同期亏损。\n- 创新药龙头盈利拐点信号，利好医药板块情绪\n\n### 🎯 8. 京沪高铁宣布票价上浮20%\n京沪高铁公告，对京沪高速线、合蚌高速线动车组列车公布票价进行优化调整，**上浮20%**。各站间执行票价以公布票价为上限，实行不同幅度折扣。\n- 高铁票价市场化信号，利好铁路运输板块\n\n### 🚀 9. 阶跃星辰完成25亿美金融资，腾讯跟投\n据悉老股东腾讯已跟投阶跃星辰新一轮融资。上周消息称阶跃即将完成25亿美金融资，已拆除红筹架构，加速赴港IPO准备。\n- 大模型赛道融资持续火热\n\n### 📊 10. 国家队持仓市值约4.41万亿元\n2026年一季度末，国家队所持A股公司股份期末总市值约4.41万亿元，金融领域仍是重仓阵地。上证指数昨日收盘4225.02点，创**2015年7月2日以来新高**。\n\n### ⚠️ 11. ST百利被证监会立案\nST百利因涉嫌信息披露违法违规，收到证监会《立案告知书》。\n\n---\n\n## 📈 三、今日盘前预判\n\n### 昨日收盘回顾（5月11日）\n\n| 指数 | 收盘 | 涨跌幅 | 备注 |\n|------|------|--------|------|\n| 上证指数 | 4225.02 | +1.08% | 站上4200，创2015年7月以来新高 |\n| 深证成指 | 15899.30 | +2.16% | — |\n| 创业板指 | 3928.97 | +3.50% | 创近11年新高 |\n| 科创50 | 1716.69 | +4.65% | 早盘创历史新高后回落整固 |\n| 成交额 | 35,640亿 | +4,895亿 | 连续4日超3万亿 |\n\n### 今日预判方向\n\n| 维度 | 预判 | 核心逻辑 |\n|------|------|---------|\n| **大盘** | ⚖️ **震荡偏强** | 成交3.5万亿+美股新高，但连续大涨后获利盘累积 |\n| **科技/算力** | 🟢 **维持热度** | 融资资金高度集中+政策利好+美股科技外溢 |\n| **算电协同** | 🟢 **新催化** | 四部门AI-能源双向赋能方案落地 |\n| **中芯国际** | 🟢 **重组利好** | 406亿收购中芯北方获批 |\n| **新能源车** | ⚖️ 分化 | 渗透率60%里程碑，但销量同比下滑 |\n| **红利/银行** | 🔴 短线承压 | 风险偏好提升，资金从防御撤出 |\n| **创新药** | 🟢 情绪催化 | 百济神州扭亏为盈 |\n| **高铁/运输** | 🟢 票价上调 | 京沪高铁涨价20% |\n\n### 今日关键位置\n\n| 指数 | 关键压力 | 关键支撑 | 预判 |\n|------|---------|---------|------|\n| 上证指数 | 4250~4280 | 4180~4200 | 震荡偏强，但短期涨幅已大 |\n| 科创50 | 1750（历史新高） | 1680~1700 | 新高整固后有望继续上攻 |\n| 创业板指 | 3950~4000 | 3850~3880 | 趋势向上但需关注尾盘走势 |\n\n### 今日重点关注\n\n1. **特朗普访华预热（5/13-15）** → 何立峰今日赴韩先遣谈判，关注谈判信号\n2. **成交额能否维持3.5万亿** → 量能不萎缩，行情延续\n3. **科创50能否再攻新高** → 昨日冲高回落，今日能否反包\n4. **北向资金净流入** → 特朗普访华预期下外资是否持续流入\n5. **美联储换帅关注** → 鲍威尔5月15日卸任，沃什将任主席\n\n---\n\n## 💡 四、交易策略参考\n\n### 📦 红利持仓（长线低波）\n- **维持持有**，不受短线科技风格切换影响\n- 银行板块近期承压，但红利长线逻辑未变\n- 铁路/能源红利受政策支撑（京沪高铁涨价、AI-能源政策）\n\n### 🚀 科技波段（半导体/云计算/机器人）\n\n**今日重点方向：**\n\n1. **AI算力/半导体** → 融资资金高度集中，美股科技创新高外溢，中芯国际重组利好 → 但一致预期极高，注意短期分歧\n2. **算电协同** → 四部门新政策落地，润建股份、科华数据、中恒电气继续关注\n3. **中芯国际** → 406亿收购中芯北方获批，产业链利好（设备/材料供应商）\n4. **创新药** → 百济神州扭亏催化，关注生物医药板块情绪传导\n\n### 今日操作基调\n\n```\n- 连续大涨3天后（沪指+1.08%，创业板+3.5%，科创 计划延长，乌克兰仍指责对方破坏停火\n- 俄总统助理：美特使或近期访俄继续对话\n- 世卫组织：\"洪迪厄斯\"号邮轮乘客开始下船，汉坦疫情感染风险低\n- **美股方面**：纳指科技ETF（景顺）将于 5月11日开市起停牌，提示高溢价风险\n\n---\n\n## 📈 二、上周A股指数回顾（5/6-5/8）\n\n| 指数 | 周五收盘 | 周涨幅 | 周振幅 |\n|------|----------|--------|--------|\n| 上证指数 | 4163.85 | +1.65% | 4129.91→4183.06 |\n| 深证成指 | 15520.38 | +3.02% | 15254.99→15652.58 |\n| 创业板指 | 3792.04 | +3.24% | 3724.53→3840.16 |\n\n**关键数据**：\n- 上证周五基本平收（-0.14点，-0.00%），收于 4163.85\n- 深证周内弹性最大，周涨幅 3.02%\n- 创业板周内先扬后抑，周五回调 -0.96%，但周涨幅仍达 3.24%\n- 合计周成交量：沪市约 2083 亿股（约 4157 亿），深市约 2497 亿股（约 5263 亿）\n- 日均成交量维持在较高水平，市场交投活跃\n\n---\n\n## 🔥 三、热点板块与主题\n\n### 核心主线：算电协同（本周最强主题）\n\n**政策定调**：5月9日会议明确提出加快水网、新型电网、算力网、新一代通信网基础设施建设。算力网与新型电网并列提出，信号意义极强。\n\n**龙头表现**：\n- 大唐发电（601991）：三天三板，全国首个大规模算电协同绿电直供项目（宁夏中卫云基地50万千瓦光伏电站）投运\n- 润建股份（002929）：五象云谷智算中心+能源网络布局，逻辑最纯正的算电协同实干型选手\n- 科华数据（002335）：智算+光储融合方案，兼具电力和算力双重技术储备\n- 中恒电气（002364）：宁德时代41亿元战略投资控股股东，数据中心高压直流电源龙头\n- 甘肃能源（000791）：庆阳东数西算产业园绿电聚合项目一期已并网\n\n### AI / 算力链（中期主线延续）\n\n- DeepSeek 融资500亿落地，算力需求确定性进一步强化\n- 沪深300前十大权重五年换血：中际旭创、新易盛、寒武纪、立讯精密等算力/光模块标的跻身前十\n- 光模块、AI芯片、有色金属（紫金矿业）成为沪深300上涨主力驱动\n\n### 机器人\n- 2026世界人形机器人运动会能量传递国内首站启动（周末新闻联播报道）\n- 这也是机器人板块持续的政策催化\n\n### 半导体\n- 美国存储芯片（美光、三星等）近期上涨，传导至A股存储/半导体方向\n- 国常会强调原创性引领性科技攻关\n\n### 锂电池\n- 受高盛研报影响连续调整，需关注是破位还是洗盘\n\n### 红利方向\n- 沪深300今年累计涨幅 +5.23%，部分红利权重股（银行、煤炭）表现稳定\n- 但从沪深300权重变迁看，传统红利（兴业银行、格力电器）已被科技/资源股（寒武纪、紫金矿业）挤出前十\n\n---\n\n## 📉 四、市场情绪与资金面\n\n**情绪阶段判断**：修复 → 震荡\n- 周初（5/6-5/7）涨幅可观，情绪积极修复\n- 周五（5/8）创业板回调 -0.96%，涨停家数及北上资金动态需关注明日数据\n- 节后首周仅3个交易日，完整的情绪周期判断需等下周更多数据\n\n**关注周一开盘信号**：\n1. 北向资金流向 —— 中东局势是否影响外资态度\n2. 成交量能否维持在万亿以上 —— 周五大盘股调整是否缩量\n3. 算电协同板块是否形成持续赚钱效应\n4. DeepSeek融资消息的进一步市场反应\n\n---\n\n## 💡 五、交易策略参考\n\n### 📦 红利持仓（长线低波）\n- **策略**：维持持有，不必因短线波动调整\n- **关注**：一季度分红政策是否超预期（如大唐发电已修订分红政策，不低于可分配利润50%分红）\n- **风险**：中东局势升温可能导致资源股走强，但对红利指数整体影响有限\n\n### 🚀 科技波段（半导体/云计算/机器人）\n\n**【算电协同】—— 下周重点关注方向**\n- 政策定调+龙头打样，应是下周最确定的方向\n- 关注：大唐发电（已三连板看分歧）、润建股份、科华数据、中恒电气\n- 注意：三连板后追高风险较大，分歧可寻找低吸机会\n\n**【AI算力链】—— 中期逻辑未变**\n- DeepSeek融资500亿落地，算力投资确定性进一步加强\n- 中际旭创/新易盛（光模块）：沪深300权重，趋势尚好\n- 海光信息/寒武纪（国产GPU）：国产替代+算力需求双驱动\n- 注意：寒武纪已在高位，关注业绩兑现节奏\n\n**【机器人】—— 政策持续催化**\n- 世界人形机器人运动会启动，关注相关标的（绿的谐波、汇川技术等）\n\n### 上证指数关键位置\n\n| 方向 | 位置 | 说明 |\n|------|------|------|\n| 压力位 | 4180~4200 | 上周五最高 4183，短期压力位 |\n| 支撑位 | 4154（周五低点） | 短线支撑 |\n| 强支撑 | 4130~4100 | 上周低点区域，跌破需警惕 |\n| 突破确认 | >4200 且放量 | 开启新一轮上行空间 |\n\n---\n\n## ⚠️ 风险提示\n\n1. **中东地缘风险**：霍尔木兹海峡局势仍在升级，伊朗-美以对峙加剧，国际油价可能冲击 A 股风险偏好\n2. **DeepSeek 鲶鱼效应**：降价策略可能导致 AI 应用层公司估值面临重构压力（已看到 MiniMax、智谱大跌）\n3. **美股高溢价风险**：纳指科技ETF停牌警示，QDII 高溢价风险需要关注\n4. **一季报窗口末期**：4月底财报密集披露期刚过，但部分公司季报仍在消化，关注业绩暴雷的尾部风险\n5. **仓位控制**：上周末有异动，周一若高开幅度大（>0.5%）不要追涨；若低开可逐步低吸\n\n---\n\n*分析仅供参考，不构成投资建议。投资有风险，入市需谨慎。*\n"},{"date":"2026-04-27","md":"# 📊 盘前分析 — 2026-04-27 (周一)\n\n---\n\n## 🌏 一、宏观与外围\n\n### 盘前核心事件\n\n**1️⃣ 一季度规模以上工业企业利润同比+15.5%**\n新闻联播披露，经济数据开局良好，\"十五五\"開局经济政策基调积极。\n\n**2️⃣ DeepSeek-V4 发布后首个交易日**\n- 上周五（4/24）DeepSeek-V4 预览版正式发布并开源\n- 发布当日即完成与国产算力全面适配（华为昇腾、寒武纪、海光信息、摩尔线程等）\n- 首次外部股权融资启动，目标估值≥100亿美元，计划融资18亿美元\n- 两科技巨头参与投资\n\n**3️⃣ 美股上周五科技股回暖**\n- 英伟达大涨4.32%收208.27美元，市值重回5万亿美元\n- 英特尔单日暴涨23.6%（1987年以来最大单日涨幅）\n- 费城半导体指数走强，AI算力需求未被证伪\n\n**4️⃣ 国内政策加码**\n- 国常会强调加强原创性引领性科技攻关\n- 美方出口管制法案落地（《硬件技术控制多边协同法案》）\n- 国产替代紧迫性和确定性进一步提升\n\n### 隔夜国际市场（预期传导）\n\n| 品种 | 状态 | 传导方向 |\n|------|------|---------|\n| 美股科技 | 英伟达/英特尔大涨 | 利好A股半导体开盘情绪 |\n| 美元指数 | 近期走弱 | 利好外资流入港A股 |\n| 人民币汇率 | 相对稳定 | 对出口无明显冲击 |\n| 国际油价 | 重回105美元上方（美伊谈判反复） | 利好石油板块 |\n\n---\n\n## 📈 二、上周五A股收盘回顾（4月24日）\n\n| 指数 | 收盘价 | 涨跌幅 |\n|------|--------|--------|\n| 上证指数 | 4079.90 | ▼0.33% |\n| 深证成指 | 14940.30 | ▼0.69% |\n| 创业板指 | 3667.78 | ▼1.41% |\n| 科创50 | 1453.69 | ▲1.47% |\n\n- 全市场成交2.64万亿，维持在2.6万亿上方\n- 涨跌家数比1994:3085，跌多涨少\n- 涨停68只，跌停40只，情绪偏分歧\n- **科创50逆势收红+1.47%**，半导体方向资金已有布局\n\n---\n\n## 🔥 三、周一盘面预判\n\n### 开盘预期\n\n**高开概率大**（DeepSeek-V4 利好催化尚未完全消化）：\n\n- 上周五半导体已有资金入场（科创50逆势收红）\n- 周末DeepSeek-V4融资消息继续发酵\n- 美股半导体表现强势的情绪传导\n\n### 关注信号\n\n1. **北向资金开盘流向** — 若持续净流入，市场信心增强\n2. **成交量能否维持2.5万亿以上** — 缩量需谨慎，放量可看高一线\n3. **科创50能否延续强势** — 作为半导体行情风向标\n4. **四月底财报密集披露** — 关注个股业绩雷\n\n### 板块预判\n\n| 板块 | 方向 | 逻辑 |\n|------|------|------|\n| **半导体** | ✅ 核心催化 | DeepSeek-V4+国产算力适配，利好海光信息、寒武纪、中芯等 |\n| **算力基建** | ✅ 直接受益 | DeepSeek融资用于算力中心建设，服务器/光模块/IDC |\n| **机器人** | ✅ 辅助催化 | AI产业延伸 |\n| **红利防御** | ➡ 稳定持有 | 煤炭/油气/银行上周有表现 |\n| **AI大模型** | ⚠️ 注意高低切换 | 智谱、MiniMax前期涨幅大，有获利兑现压力 |\n\n### 压力支撑位\n\n- **上证指数**：压力位 4093~4100，支撑位 4053~4040\n- **科创50**：上攻阻力 1480~1500，突破则打开空间\n\n---\n\n## 💡 四、交易策略参考\n\n### 科技波段（半导体/云计算/机器人）\n\n**① 半导体 — 今日核心方向**\n- ✅ 利好消息密集：DeepSeek-V4 + 国产算力适配 + 美股科技回暖\n- ✅ 上周五已有资金提前布局（科创50逆势收红）\n- ⚠️ 如果高开幅度过大（>2%），不要追涨，等盘中回落再低吸\n- 若高开高走且放量，可持股观察\n\n**② 云计算/算力基建**\n- 算力龙头作为波段核心\n- 国产芯片适配拉动国产服务器需求\n\n**③ 机器人**\n- AI产业延伸催化，但短期消息面偏弱\n- 作为卫星配置，等待轮动信号\n\n### 红利指数\n- 上周防御性板块有表现，红利指数整体稳定\n- 市场分歧阶段资金有向防御切换迹象\n- 策略：继续持有，不受短期科技波动影响\n\n### 仓位建议\n- 科技方向：5~6成（若高开不过分追涨）\n- 红利方向：2~3成（继续持有）\n- 整体仓位：6~8成，保留子弹应对节前兑现压力\n\n---\n\n## ⚠️ 风险提示\n\n1. **高开低走风险** — 上周五情绪偏弱，若高开后量能不济，可能获利兑现\n2. **五一节前效应** — 本周只有3个交易日（4/27~4/29），资金可能偏谨慎\n3. **财报季个股雷** — 4月底财报密集披露，注意业绩低于预期的标的\n4. **美伊局势反复** — 油价波动可能传导至A股能源板块\n\n---\n\n> **以上分析仅供参考，不构成投资建议。市场有风险，投资需谨慎。**\n"}];

function renderMd(text){
  var h=esc(text),blocks=[];
  // match triple backticks - use explicit char code to avoid template literal issues
  h=h.replace(RegExp('`{3}(\w*)\n([\\s\\S]*?)`{3}','g'),function(_,l,c){var i=blocks.length;blocks.push('<pre><code>'+c.trim()+'</code></pre>');return '%%B'+i+'%%';});
  h=h.replace(RegExp('`([^`]+)`','g'),'<code>$1</code>');
  h=h.replace(/^###### (.*$)/gm,'<h6>$1</h6>').replace(/^##### (.*$)/gm,'<h5>$1</h5>').replace(/^#### (.*$)/gm,'<h4>$1</h4>').replace(/^### (.*$)/gm,'<h3>$1</h3>').replace(/^## (.*$)/gm,'<h2>$1</h2>').replace(/^# (.*$)/gm,'<h1>$1</h1>');
  h=h.replace(/^---+$/gm,'<hr>').replace(/^> (.*$)/gm,'<blockquote>$1</blockquote>');
  h=h.replace(/\*\*\*(.+?)\*\*\*/g,'<strong><em>$1</em></strong>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>');
  h=h.replace(/^- (.*$)/gm,'<li>$1</li>').replace(/^\d+\. (.*$)/gm,'<li>$1</li>');
  h=h.replace(/!\[([^\]]*)\]\(([^)]+)\)/g,'<img src="$2" alt="$1">').replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank">$1</a>');
  h=h.replace(/\|(.+)\|/g,function(m){if(/^\|[\s\-:]+\|$/.test(m))return '';return m.split('|').filter(function(c){return c.trim()}).map(function(c){return '<td>'+c.trim()+'</td>'}).join('');});
  var L=h.split('\n'),r='',T=0,Ls=0;
  for(var i=0;i<L.length;i++){var t=L[i].trim();
    if(/^%%B\d+%%$/.test(t)){if(Ls){r+='</ul>';Ls=0;}r+=blocks[+t.match(/\d+/)[0]]+'\n';continue;}
    if(/^<h\d/.test(t)||/^<hr/.test(t)||/^<pre/.test(t)){if(Ls){r+='</ul>';Ls=0;}r+=t+'\n';continue;}
    if(/^<blockquote/.test(t)){if(Ls){r+='</ul>';Ls=0;}r+=t+'\n';continue;}
    if(/^<\/blockquote/.test(t)){r+=t+'\n';continue;}
    if(/^<li/.test(t)){if(!Ls){r+='<ul>';Ls=1;}r+=t+'\n';continue;}
    if(/^<td/.test(t)){if(!T){r+='<table><tr>';T=1;}r+=t;continue;}
    if(T&&t===''){r+='<\/tr><\/table>\n';T=0;continue;}
    if(t===''&&Ls){r+='<\/ul>';Ls=0;continue;}
    if(t&&!/^</.test(t)){if(Ls){r+='<\/ul>';Ls=0;}r+='<p>'+t+'<\/p>\n';}
  }
  if(Ls)r+='<\/ul>';if(T)r+='<\/tr><\/table>';return r;
}
var le=document.getElementById('dateList'),ce=document.getElementById('content'),cnt=document.getElementById('reportCount');
function build(){le.innerHTML='';
  for(var i=REPORTS.length-1;i>=0;i--)(function(r,idx){
    var d=document.createElement('div');
    d.className='date-item'+(idx===REPORTS.length-1?' active':'');
    d.innerHTML='<span>'+r.date+'</span><span class="day">周'+wd(r.date)+'</span>';
    d.onclick=function(){document.querySelectorAll('.date-item').forEach(function(e){e.classList.remove('active')});d.classList.add('active');location.hash=r.date;show(r);};
    le.appendChild(d);
  })(REPORTS[i],i);
  cnt.textContent='共 '+REPORTS.length+' 份报告';
}
function show(r){
  ce.innerHTML='<div style="font-size:12px;color:#666;margin-bottom:10px;">'+r.date+' · 星期'+wd(r.date)+'</div><div class="md-body">'+renderMd(r.md)+'</div>';
}
function fromHash(){
  var h=location.hash.replace('#','');
  for(var i=0;i<REPORTS.length;i++){if(REPORTS[i].date===h){
    var items=document.querySelectorAll('.date-item');
    items.forEach(function(e){e.classList.remove('active')});
    if(items[items.length-1-i])items[items.length-1-i].classList.add('active');
    show(REPORTS[i]);return true;
  }}return false;
}
build();if(!fromHash()&&REPORTS.length>0){var f=document.querySelector('.date-item');if(f)f.click();}</script>
